[pytest]
testpaths = tests
addopts = -m "not live" -p no:cacheprovider
markers =
    perf: performance budgets per game (~80 s each; run in CI and scripts/deploy.py; skip locally with -m 'not live and not perf')
    live: post-deploy smoke tests against https://gameindubai.com (run with: pytest -m live)
